<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">


  <link href="./public/bootstrap/css/bootstrap.min.css" rel="stylesheet">

  <link rel="stylesheet" type="text/css" href="./public/style.css">

  <title>{% block title %}My Shop{% endblock %}</title>
</head>
<body>
  <header class="site-header">
    <div class="text-center py-1 text-white" style="background-color: #222; font-size: 0.85rem;">
       Free shipping on orders over $150 &nbsp;|&nbsp; RetroZone — Est. 2026
    </div>
    <nav class="navbar navbar-expand-md navbar-dark">
      <div class="container">
        <a class="navbar-brand mr-4" href="/">Retro Store</a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarToggle" aria-controls="navbarToggle" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarToggle">
          <div class="navbar-nav mr-auto">
            <a class="nav-item nav-link {% if request.path == '/' %}active{% endif %}" href="/">Products</a>
            <a class="nav-item nav-link {% if request.path == '/cart' %}active{% endif %}" href="/cart">Cart</a>
            <a class="nav-item nav-link {% if request.path == '/contact' %}active{% endif %}" href="/contact">Contact</a>
          </div>
        </div>
      </div>
    </nav>
  </header>

  <main role="main" class="container">
    <div class="row">
      <div class="col-md-12">
        {% block content %}{% endblock %}
      </div>
    </div>
  </main>

  <script src="./public/bootstrap/js/bootstrap.bundle.min.js"></script>

</body>
</html>
